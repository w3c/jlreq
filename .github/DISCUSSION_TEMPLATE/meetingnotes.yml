title: "Meeting Notes"
body:
  - type: markdown
    attributes:
      value: |
        # How to add new meeting note
        Fill following fields, and edit markdown formatting after submission if you need.
  - type: input
    id: meetingnotes
    attributes:
      label: JLreq TF meeting notes
      description: input date as yyyy-mm-dd
      value: yyyy-mm-dd
  - type: input
    id: Attendee
    attributes:
      label: Attendee
      description: input names of attendee
  - type: textarea
    id: Agenda
    attributes: 
      label: Agenda
      description: list agenda items
      value: |
        ## Previous meeting on [yyyy-mm-dd]()
        ## For this meeting
  - type: textarea
    id: Minutes
    attributes:
      label: Minutes
      description: paste minutes here
      value: |
        ## Agenda 1
        XXXX
        ## Agenda 2
        XXXX
  - type: input
    id: nextmeeting
    attributes:
      label: The next JLreq TF meeting
      description: put date of next meeting
      value: yyyy-mm-dd
